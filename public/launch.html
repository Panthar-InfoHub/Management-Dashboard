<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Panthar</title>
  <!--
    Launch screen. The service worker answers with this page, from its cache,
    when the app opens with no window running yet, so something shows at once
    instead of a black screen while the server (and the sign-in check) work.
    It then loads the real page; the browser keeps this one on screen until
    that page can paint, and that page shows the same logo (#app-splash).
    Colours and logo size match #app-splash in app/globals.css.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    body { display: flex; align-items: center; justify-content: center; }
    img { width: 88px; height: 88px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0a0a0a; }
      img { filter: invert(1); }
    }
  </style>
</head>
<body>
  <img src="/images/black_logo.webp" alt="">
  <script>
    // Paint this screen first, then go to the page that was asked for. The
    // _launch mark tells the service worker not to answer with this page again.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var url = new URL(location.href);
        url.searchParams.set('_launch', '1');
        location.replace(url.href);
      });
    });
  </script>
</body>
</html>
