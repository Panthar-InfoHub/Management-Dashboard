version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: panthar-teams-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: panthar
      POSTGRES_PASSWORD: panthar_dev_2026
      POSTGRES_DB: panthar_teams
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
